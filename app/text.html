<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 text-slate-800 pb-24 lg:pb-0">
    <!-- 1. ヘッダー -->
    <header
      class="bg-amber-400 text-white px-4 py-3 flex justify-between items-center sticky top-0 z-20"
    >
      <div class="flex items-center gap-3">
        <!-- SP用ハンバーガーボタン -->
        <button class="lg:hidden text-white font-bold text-xl">☰</button>
        <h1 class="font-bold text-lg">学友館 教材WEB注文システム</h1>
      </div>
      <div class="flex items-center gap-4 text-xs md:text-sm">
        <span>東京第一小学校 第4学年</span>
        <button class="bg-amber-500 hover:bg-amber-600 px-3 py-1 rounded">
          ログアウト
        </button>
      </div>
    </header>

    <!-- 全体レイアウト（レスポンシブグリッド） -->
    <div
      class="max-w-[1440px] mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6"
    >
      <!-- 2. 左ナビゲーション（PCは常時表示 / SP・TBは非表示） -->
      <aside class="hidden lg:block lg:col-span-2 space-y-2">
        <a
          href="#"
          class="block bg-slate-200 hover:bg-slate-300 font-bold p-3 rounded-lg text-slate-700 text-center"
          >教材検索</a
        >
        <a
          href="#"
          class="block bg-slate-200 hover:bg-slate-300 font-bold p-3 rounded-lg text-slate-700 text-center"
          >注文履歴</a
        >
      </aside>

      <!-- 3. 中央メインコンテンツ -->
      <main class="lg:col-span-7 space-y-6">
        <!-- ステップナビ -->
        <div
          class="bg-white p-4 rounded-xl shadow-sm flex justify-around text-xs md:text-sm"
        >
          <div class="flex items-center gap-2 text-blue-600 font-bold">
            <span
              class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center"
              >1</span
            >
            <span>商品選択</span>
          </div>
          <div class="flex items-center gap-2 text-slate-400">
            <span
              class="w-6 h-6 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center"
              >2</span
            >
            <span>注文確認</span>
          </div>
          <div class="flex items-center gap-2 text-slate-400">
            <span
              class="w-6 h-6 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center"
              >3</span
            >
            <span>送信完了</span>
          </div>
        </div>

        <!-- カテゴリタブ（SPは横スクロール化） -->
        <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
          <button
            class="bg-blue-800 text-white px-4 py-2 rounded-lg whitespace-nowrap font-bold"
          >
            特売ノート
          </button>
          <button
            class="bg-white text-slate-600 px-4 py-2 rounded-lg whitespace-nowrap border hover:bg-slate-50"
          >
            特売ファイル
          </button>
          <button
            class="bg-white text-slate-600 px-4 py-2 rounded-lg whitespace-nowrap border hover:bg-slate-50"
          >
            特売その他
          </button>
          <button
            class="bg-white text-slate-600 px-4 py-2 rounded-lg whitespace-nowrap border hover:bg-slate-50"
          >
            教材
          </button>
          <button
            class="bg-white text-slate-600 px-4 py-2 rounded-lg whitespace-nowrap border hover:bg-slate-50"
          >
            ドリル
          </button>
        </div>

        <!-- 商品グリッド（SP:1列 / TB・PC:2列） -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- 商品カード 1 -->
          <div
            class="bg-white rounded-xl shadow-sm overflow-hidden flex flex-col justify-between border"
          >
            <div>
              <div class="h-40 bg-slate-200 relative">
                <img
                  src="/api/placeholder/300/160"
                  alt="漢字練習帳"
                  class="w-full h-full object-cover"
                />
              </div>
              <div class="p-4 space-y-2">
                <span
                  class="inline-block bg-orange-100 text-orange-700 text-xs px-2 py-0.5 rounded font-bold"
                  >⚠ 直近で注文済みです</span
                >
                <h3 class="font-bold text-sm leading-snug">
                  漢字練習帳 84字（東京学習・特別版）
                </h3>
              </div>
            </div>
            <div class="p-4 pt-0 flex justify-between items-center">
              <div>
                <span class="text-xs text-slate-400">単価</span>
                <p class="font-bold text-lg">
                  ¥120
                  <span class="text-xs font-normal text-slate-400">(税込)</span>
                </p>
              </div>
              <button
                class="bg-blue-50 text-blue-600 font-bold px-4 py-2 rounded-lg hover:bg-blue-100"
              >
                選択する
              </button>
            </div>
          </div>

          <!-- 商品カード 2 -->
          <div
            class="bg-white rounded-xl shadow-sm overflow-hidden flex flex-col justify-between border"
          >
            <div>
              <div class="h-40 bg-slate-200">
                <img
                  src="/api/placeholder/300/160"
                  alt="算数ノート"
                  class="w-full h-full object-cover"
                />
              </div>
              <div class="p-4 space-y-2">
                <h3 class="font-bold text-sm leading-snug">
                  特売算数ノート 17マス
                </h3>
              </div>
            </div>
            <div class="p-4 pt-0 flex justify-between items-center">
              <div>
                <span class="text-xs text-slate-400">単価</span>
                <p class="font-bold text-lg">
                  ¥110
                  <span class="text-xs font-normal text-slate-400">(税込)</span>
                </p>
              </div>
              <button
                class="bg-blue-50 text-blue-600 font-bold px-4 py-2 rounded-lg hover:bg-blue-100"
              >
                選択する
              </button>
            </div>
          </div>
        </div>
      </main>

      <!-- 4. 右サイドバー：現在の選択内容（PCのみ表示） -->
      <aside
        class="hidden lg:block lg:col-span-3 bg-white p-4 rounded-xl shadow-sm h-fit sticky top-20 space-y-4"
      >
        <h2
          class="font-bold text-slate-700 flex items-center gap-2 border-b pb-2"
        >
          🛒 現在の選択内容
        </h2>
        <div class="space-y-3 text-sm">
          <div
            class="bg-slate-50 p-3 rounded-lg flex justify-between items-center"
          >
            <div>
              <p class="font-bold">漢字練習帳 84字</p>
              <p class="text-xs text-slate-500">数量: 35冊</p>
            </div>
            <p class="font-bold">¥4,200</p>
          </div>
          <div
            class="bg-slate-50 p-3 rounded-lg flex justify-between items-center"
          >
            <div>
              <p class="font-bold">特売算数ノート 17マス</p>
              <p class="text-xs text-slate-500">数量: 32冊</p>
            </div>
            <p class="font-bold">¥3,520</p>
          </div>
        </div>
        <div class="border-t pt-3 space-y-1">
          <div class="flex justify-between text-xs text-slate-500">
            <span>合計冊数</span>
            <span class="font-bold text-slate-800">67 冊</span>
          </div>
          <div class="flex justify-between text-base font-bold text-slate-800">
            <span>合計金額</span>
            <span class="text-red-600 text-xl">¥7,720</span>
          </div>
        </div>
        <button
          class="w-full bg-amber-400 hover:bg-amber-500 text-white font-bold py-3 rounded-xl shadow"
        >
          注文確認へ進む
        </button>
      </aside>
    </div>

    <!-- 5. SP用 固定ボトムバー（スマホ・タブレット時のみ表示） -->
    <div
      class="lg:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-3 px-4 shadow-lg z-30 flex items-center justify-between"
    >
      <div>
        <div class="text-xs text-slate-500">合計 67冊</div>
        <div class="text-lg font-bold text-red-600">¥7,720</div>
      </div>
      <div class="flex gap-2">
        <!-- カート内一覧を見るボタン（モーダル等を開く用） -->
        <button
          class="bg-slate-100 text-slate-700 font-bold px-3 py-2 rounded-lg text-xs"
        >
          内容確認
        </button>
        <button
          class="bg-amber-400 hover:bg-amber-500 text-white font-bold px-4 py-2 rounded-lg text-sm shadow"
        >
          注文確認へ
        </button>
      </div>
    </div>
  </body>
</html>
